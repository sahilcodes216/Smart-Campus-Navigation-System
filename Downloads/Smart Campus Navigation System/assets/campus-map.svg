<svg id="campusSvgMap" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 800" width="100%" height="100%" aria-label="Interactive Illustrated Campus Atlas Map">
  <defs>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D6CEBB" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>
    <filter id="buildingShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#16201C" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- 1. Background Land (PRD: --paper-2 #ECE6D8) -->
  <rect width="950" height="800" fill="#ECE6D8" />
  <rect width="950" height="800" fill="url(#gridPattern)" />

  <!-- 2. Green Spaces / Lawns (PRD: --moss #7C9A6B) -->
  <g id="green-spaces" fill="#7C9A6B" fill-opacity="0.32" stroke="#7C9A6B" stroke-width="1.2">
    <!-- Founders Lawn -->
    <path d="M 230 460 C 230 430, 290 430, 330 440 C 370 450, 360 510, 340 520 C 310 535, 240 520, 230 460 Z" />
    <!-- Central Garden Quad -->
    <path d="M 430 420 L 520 420 L 530 470 L 440 470 Z" />
    <!-- North Meadow -->
    <path d="M 460 140 C 510 130, 560 145, 570 180 C 580 215, 520 220, 480 210 C 445 200, 435 155, 460 140 Z" />
    <!-- Observatory Grove -->
    <path d="M 170 190 C 220 180, 250 200, 250 240 C 240 270, 190 280, 160 250 C 145 230, 150 200, 170 190 Z" />
    <!-- East Garden Courtyard -->
    <path d="M 740 440 C 780 430, 800 470, 790 510 C 760 530, 720 500, 730 460 Z" />
  </g>

  <!-- 3. Water Features (PRD: --water #9DBFC4) -->
  <g id="water-features">
    <!-- Botanical Pond -->
    <path d="M 450 515 C 470 505, 510 510, 520 535 C 525 560, 495 580, 465 575 C 435 570, 435 530, 450 515 Z" 
          fill="#9DBFC4" stroke="#7AA6AC" stroke-width="1.5" />
    <!-- Central Plaza Fountain -->
    <circle cx="360" cy="460" r="14" fill="#9DBFC4" stroke="#7AA6AC" stroke-width="1.5" />
  </g>

  <!-- 4. Pathways & Walkways (Network connected to nodes) -->
  <g id="campus-paths" stroke="#D6CEBB" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer Loop & Avenues -->
    <line x1="120" y1="700" x2="240" y2="680" />
    <line x1="120" y1="700" x2="120" y2="560" />
    <line x1="120" y1="560" x2="160" y2="470" />
    <line x1="120" y1="560" x2="280" y2="550" />
    <line x1="240" y1="680" x2="280" y2="550" />
    <line x1="240" y1="680" x2="430" y2="620" />
    <line x1="280" y1="550" x2="430" y2="620" />
    <line x1="280" y1="550" x2="280" y2="440" />
    <line x1="280" y1="550" x2="360" y2="460" />
    <line x1="160" y1="470" x2="360" y2="460" />
    <line x1="160" y1="470" x2="260" y2="320" />
    <line x1="260" y1="320" x2="210" y2="220" />
    <line x1="260" y1="320" x2="340" y2="360" />
    <line x1="280" y1="440" x2="340" y2="360" />
    <line x1="280" y1="440" x2="360" y2="460" />
    <line x1="340" y1="360" x2="450" y2="380" />
    <line x1="340" y1="360" x2="390" y2="200" />
    <line x1="210" y1="220" x2="390" y2="200" />
    <line x1="390" y1="200" x2="510" y2="170" />
    <line x1="510" y1="170" x2="620" y2="240" />
    <line x1="450" y1="380" x2="450" y2="480" />
    <line x1="450" y1="380" x2="580" y2="370" />
    <line x1="450" y1="380" x2="620" y2="240" />
    <line x1="620" y1="240" x2="680" y2="280" />
    <line x1="620" y1="240" x2="740" y2="230" />
    <line x1="740" y1="230" x2="720" y2="350" />
    <line x1="680" y1="280" x2="720" y2="350" />
    <line x1="580" y1="370" x2="720" y2="350" />
    <line x1="580" y1="370" x2="540" y2="490" />
    <line x1="720" y1="350" x2="820" y2="420" />
    <line x1="720" y1="350" x2="680" y2="540" />
    <line x1="540" y1="490" x2="680" y2="540" />
    <line x1="540" y1="490" x2="600" y2="570" />
    <line x1="540" y1="490" x2="450" y2="480" />
    <line x1="450" y1="480" x2="470" y2="560" />
    <line x1="450" y1="480" x2="360" y2="460" />
    <line x1="470" y1="560" x2="430" y2="620" />
    <line x1="470" y1="560" x2="560" y2="660" />
    <line x1="430" y1="620" x2="560" y2="660" />
    <line x1="560" y1="660" x2="600" y2="570" />
    <line x1="600" y1="570" x2="680" y2="540" />
    <line x1="680" y1="540" x2="820" y2="420" />
  </g>
  <!-- Walkway inner dashes for architectural blueprint aesthetic -->
  <g id="campus-paths-dash" stroke="#ECE6D8" stroke-width="1.8" stroke-dasharray="4 6" stroke-linecap="round" fill="none">
    <line x1="120" y1="700" x2="240" y2="680" />
    <line x1="120" y1="700" x2="120" y2="560" />
    <line x1="120" y1="560" x2="160" y2="470" />
    <line x1="120" y1="560" x2="280" y2="550" />
    <line x1="240" y1="680" x2="280" y2="550" />
    <line x1="240" y1="680" x2="430" y2="620" />
    <line x1="280" y1="550" x2="430" y2="620" />
    <line x1="280" y1="550" x2="280" y2="440" />
    <line x1="280" y1="550" x2="360" y2="460" />
    <line x1="160" y1="470" x2="360" y2="460" />
    <line x1="160" y1="470" x2="260" y2="320" />
    <line x1="260" y1="320" x2="340" y2="360" />
    <line x1="280" y1="440" x2="340" y2="360" />
    <line x1="340" y1="360" x2="450" y2="380" />
    <line x1="340" y1="360" x2="390" y2="200" />
    <line x1="390" y1="200" x2="510" y2="170" />
    <line x1="510" y1="170" x2="620" y2="240" />
    <line x1="450" y1="380" x2="450" y2="480" />
    <line x1="450" y1="380" x2="580" y2="370" />
    <line x1="450" y1="380" x2="620" y2="240" />
    <line x1="620" y1="240" x2="720" y2="350" />
    <line x1="580" y1="370" x2="720" y2="350" />
    <line x1="580" y1="370" x2="540" y2="490" />
    <line x1="720" y1="350" x2="820" y2="420" />
    <line x1="720" y1="350" x2="680" y2="540" />
    <line x1="540" y1="490" x2="680" y2="540" />
    <line x1="540" y1="490" x2="450" y2="480" />
    <line x1="450" y1="480" x2="470" y2="560" />
    <line x1="450" y1="480" x2="360" y2="460" />
    <line x1="470" y1="560" x2="430" y2="620" />
    <line x1="470" y1="560" x2="560" y2="660" />
  </g>

  <!-- 5. Building Footprints (PRD: labeled polygons in #F6F2E9 with #D6CEBB borders & #16201C labels) -->
  <g id="campus-buildings" filter="url(#buildingShadow)">
    <!-- Gatehouse A (Main Gate) -->
    <polygon points="90,680 150,680 150,720 90,720" fill="#F6F2E9" stroke="#16201C" stroke-width="1.5" />
    <text x="120" y="736" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#16201C" text-anchor="middle">GATEHOUSE A</text>

    <!-- Parking Lot P1 -->
    <rect x="60" y="590" width="80" height="60" rx="4" fill="#E4DDCB" stroke="#D6CEBB" stroke-width="1.2" stroke-dasharray="2 2" />
    <text x="100" y="625" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#4A5650" text-anchor="middle">LOT P1</text>

    <!-- Wellness Lodge -->
    <polygon points="130,440 190,440 190,490 130,490" fill="#F6F2E9" stroke="#16201C" stroke-width="1.5" />
    <text x="160" y="432" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#16201C" text-anchor="middle">WELLNESS</text>

    <!-- Block A - Founders Hall & Administration -->
    <polygon points="240,510 320,510 320,580 240,580" fill="#F6F2E9" stroke="#16201C" stroke-width="1.8" />
    <text x="280" y="542" font-family="'Instrument Serif', serif" font-size="15" fill="#16201C" text-anchor="middle">Block A</text>
    <text x="280" y="556" font-family="'JetBrains Mono', monospace" font-size="9" fill="#4A5650" text-anchor="middle">FOUNDERS HALL</text>

    <!-- Block B - Natural Sciences Complex -->
    <polygon points="210,270 300,270 300,345 250,345 250,310 210,310" fill="#F6F2E9" stroke="#16201C" stroke-width="1.8" />
    <text x="255" y="295" font-family="'Instrument Serif', serif" font-size="15" fill="#16201C" text-anchor="middle">Block B</text>
    <text x="255" y="308" font-family="'JetBrains Mono', monospace" font-size="9" fill="#4A5650" text-anchor="middle">SCIENCES</text>

    <!-- Block C - Central Library -->
    <polygon points="410,335 490,335 490,410 410,410" fill="#F6F2E9" stroke="#16201C" stroke-width="1.8" />
    <text x="450" y="370" font-family="'Instrument Serif', serif" font-size="16" fill="#16201C" text-anchor="middle">Block C</text>
    <text x="450" y="384" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0E4B41" font-weight="600" text-anchor="middle">CENTRAL LIBRARY</text>

    <!-- Block D - Humanities & Law -->
    <polygon points="340,165 440,165 440,225 340,225" fill="#F6F2E9" stroke="#16201C" stroke-width="1.8" />
    <text x="390" y="193" font-family="'Instrument Serif', serif" font-size="15" fill="#16201C" text-anchor="middle">Block D</text>
    <text x="390" y="206" font-family="'JetBrains Mono', monospace" font-size="9" fill="#4A5650" text-anchor="middle">HUMANITIES & LAW</text>

    <!-- Tech Tower - Turing Computing Centre -->
    <polygon points="575,200 665,200 665,275 575,275" fill="#F6F2E9" stroke="#16201C" stroke-width="1.8" />
    <text x="620" y="235" font-family="'Instrument Serif', serif" font-size="15" fill="#16201C" text-anchor="middle">Tech Tower</text>
    <text x="620" y="249" font-family="'JetBrains Mono', monospace" font-size="9" fill="#4A5650" text-anchor="middle">COMPUTING</text>

    <!-- Block E - Faculty of Engineering -->
    <polygon points="680,310 770,310 770,390 680,390" fill="#F6F2E9" stroke="#16201C" stroke-width="1.8" />
    <text x="725" y="347" font-family="'Instrument Serif', serif" font-size="15" fill="#16201C" text-anchor="middle">Block E</text>
    <text x="725" y="361" font-family="'JetBrains Mono', monospace" font-size="9" fill="#4A5650" text-anchor="middle">ENGINEERING</text>

    <!-- Parking Lot P2 -->
    <rect x="780" y="390" width="80" height="60" rx="4" fill="#E4DDCB" stroke="#D6CEBB" stroke-width="1.2" stroke-dasharray="2 2" />
    <text x="820" y="425" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#4A5650" text-anchor="middle">LOT P2</text>

    <!-- Block H - Main Auditorium -->
    <polygon points="380,590 480,590 470,660 390,660" fill="#F6F2E9" stroke="#16201C" stroke-width="1.8" />
    <text x="430" y="623" font-family="'Instrument Serif', serif" font-size="15" fill="#16201C" text-anchor="middle">Block H</text>
    <text x="430" y="637" font-family="'JetBrains Mono', monospace" font-size="9" fill="#4A5650" text-anchor="middle">AUDITORIUM</text>

    <!-- Commons Pavilion & Dining -->
    <polygon points="535,450 625,450 625,510 535,510" fill="#F6F2E9" stroke="#16201C" stroke-width="1.8" />
    <text x="580" y="478" font-family="'Instrument Serif', serif" font-size="14" fill="#16201C" text-anchor="middle">Commons</text>
    <text x="580" y="492" font-family="'JetBrains Mono', monospace" font-size="9" fill="#4A5650" text-anchor="middle">DINING PAVILION</text>

    <!-- Block F - Student Union -->
    <polygon points="640,510 725,510 725,575 640,575" fill="#F6F2E9" stroke="#16201C" stroke-width="1.8" />
    <text x="682" y="540" font-family="'Instrument Serif', serif" font-size="14" fill="#16201C" text-anchor="middle">Block F</text>
    <text x="682" y="554" font-family="'JetBrains Mono', monospace" font-size="9" fill="#4A5650" text-anchor="middle">STUDENT UNION</text>

    <!-- Arts Annex G -->
    <polygon points="310,340 370,340 370,380 310,380" fill="#F6F2E9" stroke="#16201C" stroke-width="1.5" />
    <text x="340" y="364" font-family="'JetBrains Mono', monospace" font-size="9" fill="#4A5650" text-anchor="middle">ARTS G</text>
  </g>

  <!-- Trees / Plantings Iconography in --moss -->
  <g id="campus-trees" fill="#7C9A6B" opacity="0.6">
    <circle cx="210" cy="450" r="5" />
    <circle cx="225" cy="470" r="4" />
    <circle cx="370" cy="480" r="6" />
    <circle cx="490" cy="310" r="5" />
    <circle cx="510" cy="330" r="4" />
    <circle cx="550" cy="220" r="5" />
    <circle cx="700" cy="240" r="6" />
    <circle cx="650" cy="440" r="5" />
    <circle cx="510" cy="610" r="6" />
    <circle cx="340" cy="630" r="5" />
  </g>

  <!-- 6. Active Animated Route Line (PRD: --signal #E8552D with rounded caps) -->
  <g id="map-route-layer">
    <!-- Dynamic polyline/path will be injected here by routes.js -->
  </g>

  <!-- 7. Interactive Markers Layer (Injected or bound by map.js) -->
  <g id="map-markers-layer">
    <!-- Pins generated from locations.json -->
  </g>
</svg>
